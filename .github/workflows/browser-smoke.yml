name: Real Playwright browser smoke
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'worker/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'tests/browser.test.mjs'
      - 'tests/dashboard-browser.test.mjs'
      - 'tests/visual-typography.test.mjs'
      - '.github/workflows/browser-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run Chromium DOM and dashboard journeys
        run: |
          export TG_BROWSER_EXECUTABLE="$(node --input-type=module -e "import {chromium} from 'playwright';console.log(chromium.executablePath())")"
          node --test tests/chromium-dom-integration.test.mjs tests/browser.test.mjs tests/dashboard-browser.test.mjs tests/visual-typography.test.mjs
