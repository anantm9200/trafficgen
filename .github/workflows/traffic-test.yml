name: Verified synthetic browser test
on:
  push:
    branches: [main]
    paths:
      - 'plans/active.json'
  workflow_dispatch:
    inputs:
      plan_b64:
        description: Base64url JSON test plan dispatched by the authenticated Vercel API
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: trafficgen-worker
  cancel-in-progress: false
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAN_B64: ${{ inputs.plan_b64 }}
      GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
      GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
      DGX_AI_ENDPOINT: ${{ secrets.DGX_AI_ENDPOINT }}
      DGX_AI_MODEL: ${{ secrets.DGX_AI_MODEL }}
      DGX_AI_API_KEY: ${{ secrets.DGX_AI_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tested runtime
        run: npm install --no-audit --no-fund
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate source
        run: npm test
      - name: Execute authorized browser journeys
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node worker/run.mjs plans/active.json
          else
            node worker/run.mjs --env-plan
          fi
      - name: Save execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visitorlab-report-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 14
